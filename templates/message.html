{% extends "base.html" %}
{% block title %}{{ title }}｜仙策閣{% endblock %}
{% block body_class %}flow-page{% endblock %}
{% block content %}
<section class="message-shell section-shell"><div class="message-card reveal"><span class="message-symbol" aria-hidden="true">◇</span><p class="plain-kicker">頁面狀態</p><h1>{{ title }}</h1><p role="status">{{ message }}</p><a class="button button-primary" href="{{ url_for('public.home') }}">返回仙策閣</a><aside class="flow-help"><strong>如果你已經購買</strong><p>可從<a href="{{ url_for('access.customer_login_page') }}">已購取回</a>重新登入；若連結仍無法使用，請前往<a href="{{ url_for('public.support') }}">私人客服</a>，不必再次付款。</p></aside></div></section>
{% endblock %}
