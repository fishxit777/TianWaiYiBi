<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理後台登入｜天外一筆</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='v16.css') }}">
</head>
<body class="admin-login-page">
  <main class="admin-login-shell">
    <section class="admin-login-brand">
      <img class="admin-login-logo" src="{{ url_for('static', filename='brand/logo-transparent-1254.png') }}" alt="天外一筆 Logo">
      <p>天外一筆・仙策閣</p>
      <h1>管理後台</h1>
      <p>集中管理仙策內容、價格、訂單、營運數據與安全事件。</p>
    </section>
    <form class="admin-login-card" action="{{ url_for('admin.login_submit') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p class="section-index">ADMIN GATE</p>
      <h2>管理員安全登入</h2>
      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label>管理帳號<input name="username" type="text" maxlength="120" autocomplete="username" required></label>
      <label>管理密令<input name="password" type="password" maxlength="512" autocomplete="current-password" required></label>
      <button class="button button-primary button-wide" type="submit">進入管理後台</button>
      <small>連續失敗將暫時封鎖來源 IP；系統不會在網址或日誌保存密令。</small>
    </form>
  </main>
</body>
</html>
