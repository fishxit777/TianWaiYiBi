services:
  - type: web
    name: tianwai-yibi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30 app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_DEV_TOOLS
        value: "false"
      - key: BASE_URL
        value: https://tianwai-yibi.onrender.com
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/tianwai.db
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: keeper
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_BIND_IP
        value: "true"
      - key: ADMIN_IP_ALLOWLIST_REQUIRED
        value: "false"
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: WEBAUTHN_RP_ID
        value: tianwai-yibi.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://tianwai-yibi.onrender.com
      - key: ADMIN_RECOVERY_ENABLED
        value: "false"
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: ecpay
      - key: ECPAY_MODE
        value: production
      - key: ECPAY_LIVE_CONFIRMED
        value: "false"
      - key: ECPAY_VERIFICATION_ENABLED
        value: "true"
      - key: ECPAY_MERCHANT_ID
        sync: false
      - key: ECPAY_HASH_KEY
        sync: false
      - key: ECPAY_HASH_IV
        sync: false
      - key: ECPAY_STORE_ID
        value: TWYB
      - key: PAYMENT_VERIFICATION_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: NOTIFICATION_CRON_SECRET
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
