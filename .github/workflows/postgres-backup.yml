name: Encrypted PostgreSQL backup

on:
  schedule:
    # 03:25 Asia/Taipei (UTC+8), daily.
    - cron: "25 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianwai-postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
      BACKUP_PUBLIC_KEY_PEM: ${{ secrets.BACKUP_PUBLIC_KEY_PEM }}
      MAX_ENCRYPTED_BYTES: "25000000"
    steps:
      - name: Check out audited backup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned encryption dependency
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.0"

      - name: Dump, validate, encrypt, and remove plaintext
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" || -z "${BACKUP_PUBLIC_KEY_PEM:-}" ]]; then
            echo "Backup secrets are not configured." >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          backup_dir="$RUNNER_TEMP/tianwai-postgres-backup"
          mkdir -m 700 "$backup_dir"
          dump_path="$backup_dir/database.dump"
          encrypted_path="$backup_dir/tianwai-yibi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.twybenc"
          cleanup() { sudo rm -f "$dump_path"; }
          trap cleanup EXIT
          docker run --rm -e DATABASE_URL -v "$backup_dir:/backup" postgres:17-alpine \
            pg_dump --format=custom --no-owner --no-privileges --file=/backup/database.dump --dbname="$DATABASE_URL"
          docker run --rm -v "$backup_dir:/backup:ro" postgres:17-alpine \
            pg_restore --list /backup/database.dump >/dev/null
          sudo chown "$(id -u):$(id -g)" "$dump_path"
          python scripts/encrypt_backup.py --input "$dump_path" --output "$encrypted_path"
          size="$(stat -c%s "$encrypted_path")"
          if (( size > MAX_ENCRYPTED_BYTES )); then
            echo "Encrypted backup exceeds the 25 MB zero-cost storage guardrail." >&2
            exit 1
          fi
          echo "artifact_path=$encrypted_path" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tianwai-yibi-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.encrypt.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
