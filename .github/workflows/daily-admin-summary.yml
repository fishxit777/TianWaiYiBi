name: Daily admin summary

on:
  schedule:
    # UTC; Asia/Taipei is UTC+8 throughout the year.
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Summary slot to send
        required: true
        type: choice
        options:
          - morning
          - noon
          - evening

permissions:
  contents: read

concurrency:
  group: tianwai-admin-summary-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://tianwai-yibi.onrender.com
      CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
    steps:
      - name: Resolve Taiwan summary slot
        id: slot
        shell: bash
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_SLOT:-}" ]]; then
            slot="$MANUAL_SLOT"
          else
            case "$SCHEDULE" in
              "0 0 * * *") slot="morning" ;;
              "0 4 * * *") slot="noon" ;;
              "0 12 * * *") slot="evening" ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Request private LINE summary
        shell: bash
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          if [[ ${#CRON_SECRET} -lt 32 ]]; then
            echo "NOTIFICATION_CRON_SECRET is missing or too short" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -X POST "$BASE_URL/internal/notifications/daily-summary" \
            -H "Content-Type: application/json" \
            -H "X-Notification-Secret: $CRON_SECRET" \
            --data "{\"slot\":\"$SLOT\"}"
