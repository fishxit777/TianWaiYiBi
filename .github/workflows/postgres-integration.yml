name: PostgreSQL integration

on:
  pull_request:
    paths:
      - "tianwai/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/postgres-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tianwai-postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tianwai_test
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: tianwai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tianwai_test -d tianwai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tianwai_test:local-ci-password@127.0.0.1:5432/tianwai_test
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Exercise real PostgreSQL adapter
        run: python -m pytest tests/test_postgres_integration.py -q
